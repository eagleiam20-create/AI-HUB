
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NEXA AI</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 24px;
      display: grid; place-items: center;
      background: #0b0b12; color: #f5f3ff;
      font: 16px Arial, sans-serif;
    }
    main {
      width: 100%; max-width: 420px; padding: 28px;
      background: #151521; border: 1px solid #303044;
      border-radius: 20px;
    }
    h1 { margin-top: 0; color: #b9a4ff; }
    p { color: #b9b8cc; line-height: 1.5; }
    input, button {
      width: 100%; padding: 13px; margin-top: 12px;
      border-radius: 10px; font-size: 16px;
    }
    input {
      color: white; background: #0d0d17;
      border: 1px solid #41415a;
    }
    button {
      cursor: pointer; border: 0; font-weight: bold;
      background: #a78bfa; color: #171126;
    }
    button.secondary { background: #303044; color: white; }
    #status { overflow-wrap: anywhere; font-size: 14px; }
    .hidden { display: none; }
  </style>
</head>
<body>
<main>
  <h1>NEXA AI</h1>
  <p>Your AI workspace starts here.</p>

  <section id="auth">
    <input id="email" type="email" placeholder="Email address"
      autocomplete="email">
    <input id="password" type="password" placeholder="Password"
      autocomplete="current-password">
    <button id="signup">Create account</button>
    <button id="login" class="secondary">Log in</button>
  </section>

  <section id="dashboard" class="hidden">
    <p id="welcome"></p>
    <h2>My credits</h2>
    <p id="credits">Loading...</p>
    <button id="logout" class="secondary">Log out</button>
  </section>

  <p id="status" role="status" aria-live="polite"></p>
</main>

<script>
  // Replace these placeholders with your Supabase Project URL
  // and Publishable key. Never use a secret/service_role key here.
  const SUPABASE_URL = "https://kvuslfmgrbtcdnauoild.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_Tyt5Fi79eJVuXqzUIK_F9Q_ggfWwnvJ";

  const authPanel = document.getElementById("auth");
  const dashboard = document.getElementById("dashboard");
  const statusBox = document.getElementById("status");

  let db;

  function status(message) {
    statusBox.textContent = message;
  }

  function showSignedIn(user) {
    authPanel.classList.add("hidden");
    dashboard.classList.remove("hidden");
    document.getElementById("welcome").textContent =
      "Logged in as " + user.email;
  }

  function showSignedOut() {
    authPanel.classList.remove("hidden");
    dashboard.classList.add("hidden");
    document.getElementById("credits").textContent = "";
  }

  async function loadProfile(user) {
    const { data, error } = await db
      .from("profiles")
      .select("credits")
      .eq("id", user.id)
      .maybeSingle();

    if (error) {
      status("Profile error: " + error.message);
      return;
    }

    if (!data) {
      document.getElementById("credits").textContent =
        "Profile not available yet.";
      return;
    }

    document.getElementById("credits").textContent =
      data.credits + " credits";
    status("Connected successfully.");
  }

  async function init() {
    if (SUPABASE_URL.startsWith("YOUR_") ||
        SUPABASE_PUBLISHABLE_KEY.startsWith("YOUR_")) {
      status("Add your Supabase URL and Publishable key first.");
      return;
    }

    db = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_PUBLISHABLE_KEY
    );

    document.getElementById("signup").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || password.length < 6) {
        status("Enter an email and a password of at least 6 characters.");
        return;
      }

      status("Creating account...");
      const { data, error } = await db.auth.signUp({
        email,
        password
      });

      if (error) return status(error.message);

      if (data.session) {
        showSignedIn(data.user);
        await loadProfile(data.user);
      } else {
        status("Signup submitted. Check your email to confirm your account, then log in.");
      }
    };

    document.getElementById("login").onclick = async () => {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      status("Logging in...");
      const { data, error } = await db.auth.signInWithPassword({
        email,
        password
      });

      if (error) return status(error.message);

      showSignedIn(data.user);
      await loadProfile(data.user);
    };

    document.getElementById("logout").onclick = async () => {
      const { error } = await db.auth.signOut();
      if (error) return status(error.message);

      showSignedOut();
      status("Logged out.");
    };

    db.auth.onAuthStateChange((event, session) => {
      if (session?.user) {
        showSignedIn(session.user);
      } else {
        showSignedOut();
      }
    });

    const { data, error } = await db.auth.getSession();
    if (error) return status(error.message);

    if (data.session?.user) {
      showSignedIn(data.session.user);
      await loadProfile(data.session.user);
    }
  }

  init();
</script>
</body>
</html>
